<!DOCTYPE html>
<html>
<head>
  <title>YouTube Learning Quiz Settings</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Settings</h1>
    <div class="form-group">
      <label for="apiKey">Google Gemini API Key:</label>
      <input type="password" id="apiKey" name="apiKey">
    </div>
    <div class="form-group">
      <label for="interval">Quiz Interval (minutes):</label>
      <input type="number" id="interval" name="interval" min="1" value="5">
    </div>
    <button id="save">Save</button>
    <p id="status"></p>
  </div>
  <script src="options.js"></script>
</body>
</html>
